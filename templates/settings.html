{% extends "base.html" %}
{% block title %}Settings – Narmada Parikrama{% endblock %}
{% block body %}
<main class="wrap" style="padding:0 20px 60px"><section class="card panel form" style="margin:22px auto">
  <h1>Settings</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <div class="at"><span>@</span><input type="text" id="username" name="username" value="{{ user.username }}" required pattern="[a-z0-9_.]{3,20}" autocapitalize="off"></div>
    <label class="chip" style="margin-top:18px;border-style:solid"><input type="checkbox" name="show_on_map" value="1" {% if user.show_on_map != 0 %}checked{% endif %}> Show me on the “online pilgrims” map (approximate area only)</label>
    <p class="meta">Name: {{ user.name }} · {{ user.email }} · {{ user.mobile }} — visible only to the site admin.</p>
    <p style="margin-top:18px"><button class="btn">Save</button> <a class="btn alt" href="{{ url_for('index') }}">Back to map</a></p>
  </form>
</section></main>
{% endblock %}
