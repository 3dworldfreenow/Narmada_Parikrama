{% extends "base.html" %}
{% block title %}Create account – Narmada Parikrama{% endblock %}
{% block body %}
<main class="wrap" style="padding:0 20px 60px">
  <section class="card panel form" style="margin:22px auto">
    <h1>Create an account</h1>
    <p class="meta">You need an account to suggest updates. Your mobile number and email are only visible to the site admin.</p>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label for="name">Full name</label><input type="text" id="name" name="name" value="{{ form.name }}" required>
      <label for="email">Email</label><input type="email" id="email" name="email" value="{{ form.email }}" required>
      <label for="mobile">Mobile number</label><input type="tel" id="mobile" name="mobile" value="{{ form.mobile }}" placeholder="98XXXXXXXX" required>
      <label for="password">Password <span class="hint">(at least 6 characters)</span></label><input type="password" id="password" name="password" required minlength="6">
      <label for="confirm">Confirm password</label><input type="password" id="confirm" name="confirm" required minlength="6">
      <p style="margin-top:18px"><button class="btn">Create account</button></p>
    </form>
    <p class="meta">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </section>
</main>
{% endblock %}
