{% extends "base.html" %}
{% block title %}Log in – Narmada Parikrama{% endblock %}
{% block body %}
<main class="auth">
  <section class="card panel form">
    <div class="brandmark">नर्मदे हर</div><h1>Narmada Parikrama Guide</h1><p class="meta">Log in to see the route map, stops, and pilgrims online now.</p>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label for="login">Username or email</label><input type="text" id="login" name="login" required autocapitalize="off" autocomplete="username">
      <label for="password">Password</label><input type="password" id="password" name="password" required>
      <p style="margin-top:18px"><button class="btn">Log in</button></p>
    </form>
    <p class="meta">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </section>
</main>
{% endblock %}
