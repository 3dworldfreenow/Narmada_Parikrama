{% extends "base.html" %}
{% block title %}Log in – Narmada Parikrama{% endblock %}
{% block body %}
<main class="wrap" style="padding:0 20px 60px">
  <section class="card panel form" style="margin:22px auto">
    <h1>Log in</h1>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label for="email">Email</label><input type="email" id="email" name="email" required>
      <label for="password">Password</label><input type="password" id="password" name="password" required>
      <p style="margin-top:18px"><button class="btn">Log in</button></p>
    </form>
    <p class="meta">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </section>
</main>
{% endblock %}
