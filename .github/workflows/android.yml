name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "static/app.css"
      - "data/stops.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Prepare app files (styles, stops data, map libraries)
        run: |
          WWW=android/app/src/main/assets/www
          mkdir -p $WWW/lib
          cp static/app.css $WWW/app.css
          python3 - <<'PY'
          import json
          d = json.load(open("data/stops.json", encoding="utf-8"))
          for i, o in enumerate(d):
              o["id"] = i + 1
          open("android/app/src/main/assets/www/seed-stops.js", "w", encoding="utf-8").write(
              "window.SEED_STOPS=" + json.dumps(d, ensure_ascii=False, separators=(",", ":")) + ";")
          PY
          curl -fsSL -o $WWW/lib/leaflet.js  https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js
          curl -fsSL -o $WWW/lib/leaflet.css https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css
          curl -fsSL -o $WWW/lib/protomaps-leaflet.js https://unpkg.com/protomaps-leaflet@5.1.0/dist/protomaps-leaflet.js
          ls -la $WWW $WWW/lib

      - name: Signing key from secrets (optional)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using the keystore from repository secrets."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret – using the shared key in android/narmada-debug.keystore."
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # empty secrets mean "use defaults"
          [ -z "$KEYSTORE_PASSWORD" ] && unset KEYSTORE_PASSWORD
          [ -z "$KEY_ALIAS" ] && unset KEY_ALIAS
          [ -z "$KEY_PASSWORD" ] && unset KEY_PASSWORD
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/NarmadaParikrama-${VERSION_NAME}.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: NarmadaParikrama-${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.VERSION_NAME }}
          name: Narmada Parikrama app ${{ env.VERSION_NAME }}
          make_latest: true
          files: dist/*.apk
          body: |
            Android app for the Narmada Parikrama guide.
            **Install:** download the `.apk` below on your phone, open it, and allow "Install unknown apps" when asked.
            First login needs internet. Then open ☰ Menu → Offline map → Download (Wi-Fi recommended).
